<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rainbow Wave</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>

    <div id="controls">
      <div class="ctrl-group">
        <div class="ctrl-label">TYPE</div>
        <div class="view-btns">
          <button class="view-btn" data-view="wave">SIDE-TO-SIDE</button>
          <button class="view-btn active" data-view="slinky">PUSH-PULL</button>
        </div>
      </div>

      <div class="ctrl-group">
        <div class="ctrl-label">AMPLITUDE</div>
        <div class="amp-row">
          <div class="amp-btns">
            <button id="driver-btn" class="amp-btn">ON</button>
            <button id="pulse-btn"  class="amp-btn">PULSE</button>
          </div>
          <div>
            <div class="step-track" id="amp-track">
              <div class="track-line"></div>
              <div class="notches">
                <button class="notch active"></button>
                <button class="notch"></button>
                <button class="notch"></button>
              </div>
            </div>
            <div class="step-values" id="amp-values"></div>
          </div>
        </div>
      </div>

      <div class="ctrl-group">
        <div class="ctrl-label">FREQUENCY</div>
        <div class="step-track" id="freq-track">
          <div class="track-line"></div>
          <div class="notches">
            <button class="notch active"></button>
            <button class="notch"></button>
            <button class="notch"></button>
            <button class="notch"></button>
          </div>
        </div>
        <div class="step-values" id="freq-values"></div>
      </div>

      <div class="ctrl-group speed-group">
        <div class="ctrl-label-row">
          <span class="ctrl-label">PLAYBACK</span>
          <div class="header-icons">
            <button id="theme-btn" class="theme-btn" title="Toggle theme">
              <span class="theme-box theme-light-box"></span>
              <span class="theme-box theme-dark-box"></span>
            </button>
            <label class="sound-label" title="Toggle sound">
              <input type="checkbox" id="sound-cb" checked>
              <span class="sound-icon">🔊</span>
            </label>
          </div>
        </div>
        <div class="speed-row">
          <img class="speed-icon turtle-icon" src="images/Turtle.png" alt="slow">
          <input type="range" id="speed-slider" min="1" max="8" value="8">
          <span class="speed-icon rabbit-icon">🐇</span>
        </div>
        <div class="transport-row">
          <button id="pause-btn" class="transport-btn">⏸</button>
          <button id="step-btn"  class="transport-btn">⏭</button>
        </div>
      </div>

      <div class="ctrl-group objects-group">
        <div class="palette-row">
          <div class="palette-item">
            <canvas id="cup-palette" class="palette-slot" width="36" height="46" title="Drag bone toy onto canvas"></canvas>
            <span class="palette-label" id="toy-label">CUP</span>
          </div>
          <div class="palette-item">
            <canvas id="tie-palette" class="palette-slot" width="36" height="46" title="Drag twist tie onto string"></canvas>
            <span class="palette-label">TIE</span>
          </div>
          <div class="palette-item">
            <button id="draw-btn" class="draw-toggle" title="Draw measurement line"><svg width="10" height="34" viewBox="0 0 10 34" xmlns="http://www.w3.org/2000/svg"><line x1="5" y1="4" x2="5" y2="30" stroke="currentColor" stroke-width="1.5"/><circle cx="5" cy="4" r="4" fill="currentColor"/><circle cx="5" cy="30" r="4" fill="currentColor"/></svg></button>
            <span class="palette-label">LINE</span>
          </div>
        </div>
        <button id="clear-all-btn" class="clear-all-btn">CLEAR</button>
      </div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
