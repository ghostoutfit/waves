<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rainbow Wave</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>

    <div id="controls">
      <div class="ctrl-group">
        <div class="ctrl-label">AMPLITUDE</div>
        <div class="step-track" id="amp-track">
          <div class="track-line"></div>
          <div class="notches">
            <button class="notch active"></button>
            <button class="notch"></button>
            <button class="notch"></button>
            <button class="notch"></button>
          </div>
        </div>
        <div class="step-values" id="amp-values"></div>
      </div>

      <div class="ctrl-group">
        <div class="ctrl-label">FREQUENCY</div>
        <div class="step-track" id="freq-track">
          <div class="track-line"></div>
          <div class="notches">
            <button class="notch active"></button>
            <button class="notch"></button>
            <button class="notch"></button>
            <button class="notch"></button>
          </div>
        </div>
        <div class="step-values" id="freq-values"></div>
      </div>

      <div class="ctrl-group speed-group">
        <div class="ctrl-label-row">
          <span class="ctrl-label">PLAYBACK</span>
          <button id="theme-btn" class="theme-btn" title="Toggle theme">
            <span class="theme-box theme-light-box"></span>
            <span class="theme-box theme-dark-box"></span>
          </button>
        </div>
        <div class="speed-row">
          <img class="speed-icon turtle-icon" src="images/Turtle.png" alt="slow">
          <input type="range" id="speed-slider" min="1" max="8" value="8">
          <span class="speed-icon rabbit-icon">🐇</span>
        </div>
        <div class="transport-row">
          <button id="pause-btn" class="transport-btn">⏸</button>
          <button id="step-btn"  class="transport-btn">⏭</button>
        </div>
      </div>

      <div class="ctrl-group objects-group">
        <div class="ctrl-label">OBJECTS</div>
        <div class="palette-row">
          <canvas id="cup-palette"  class="palette-slot" width="36" height="46" title="Drag cup onto canvas"></canvas>
          <canvas id="tie-palette"  class="palette-slot" width="24" height="46" title="Drag twist tie onto string"></canvas>
        </div>
      </div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
